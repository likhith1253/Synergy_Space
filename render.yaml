services:
  # --------------------------------------------------------------------------------
  # 1. API GATEWAY
  # The entry point for the frontend. Proxies requests to other services.
  # --------------------------------------------------------------------------------
  - type: web
    name: api-gateway
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --production=false && npm run build -w packages/types && npm run build -w packages/logger && npm run build -w packages/database && npm run build -w services/api-gateway
    startCommand: npm start -w services/api-gateway
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false # User must provide their Vercel frontend URL here
      - key: AUTH_SERVICE_URL
        sync: false # Set to your deployed Render URL e.g. https://auth-service-xxxx.onrender.com
      - key: ORG_SERVICE_URL
        sync: false # Set to your deployed Render URL e.g. https://organization-service-xxxx.onrender.com
      - key: COLLAB_SERVICE_URL
        sync: false # Set to your deployed Render URL e.g. https://collab-service-xxxx.onrender.com
      - key: DOCS_SERVICE_URL
        sync: false # Set to your deployed Render URL e.g. https://document-service-xxxx.onrender.com
      - key: AI_SERVICE_URL
        sync: false # Set to your deployed Render URL e.g. https://ai-service-xxxx.onrender.com

  # --------------------------------------------------------------------------------
  # 2. AUTH SERVICE
  # Handles user authentication and management.
  # --------------------------------------------------------------------------------
  - type: web
    name: auth-service
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --production=false && npm run build -w packages/types && npm run build -w packages/logger && npm run build -w packages/database && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build -w services/auth-service
    startCommand: node packages/database/scripts/migrate.js && npm start -w services/auth-service
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: collab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      # Set to "true" only if you want the public one-click demo account (/demo-login) enabled
      - key: ENABLE_DEMO_MODE
        sync: false

  # --------------------------------------------------------------------------------
  # 3. ORGANIZATION SERVICE
  # Handles organizations and billing.
  # --------------------------------------------------------------------------------
  - type: web
    name: organization-service
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --production=false && npm run build -w packages/types && npm run build -w packages/logger && npm run build -w packages/database && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build -w services/organization-service
    startCommand: node packages/database/scripts/wait-for-schema.js organization-service organizations,users,organization_members && npm start -w services/organization-service
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: collab-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: auth-service
          envVarKey: JWT_SECRET
      - key: CLIENT_URL
        sync: false # Frontend URL
      - key: STRIPE_SECRET_KEY
        sync: false # Stripe secret key for backend
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # Stripe webhook signing secret
      - key: CORS_ORIGIN
        sync: false

  # --------------------------------------------------------------------------------
  # 4. COLLAB SERVICE
  # Handles real-time collaboration (Socket.io).
  # --------------------------------------------------------------------------------
  - type: web
    name: collab-service
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --production=false && npm run build -w packages/types && npm run build -w packages/logger && npm run build -w packages/database && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build -w services/collab-service
    startCommand: node packages/database/scripts/wait-for-schema.js collab-service users,projects,documents && npm start -w services/collab-service
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: collab-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: auth-service
          envVarKey: JWT_SECRET
      - key: CORS_ORIGIN
        sync: false # Comma-separated frontend origin(s) allowed to open Socket.io connections

  # --------------------------------------------------------------------------------
  # 5. DOCUMENT SERVICE
  # Handles document storage and management.
  # --------------------------------------------------------------------------------
  - type: web
    name: document-service
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --production=false && npm run build -w packages/types && npm run build -w packages/logger && npm run build -w packages/database && npx prisma generate --schema=packages/database/prisma/schema.prisma && npm run build -w services/document-service
    startCommand: node packages/database/scripts/migrate.js && npm start -w services/document-service
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: collab-db
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: auth-service
          envVarKey: JWT_SECRET
      - key: FRONTEND_URL
        sync: false
      # Email settings (Optional)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # --------------------------------------------------------------------------------
  # 6. AI SERVICE
  # Python backend using Gemini API for AI features.
  # --------------------------------------------------------------------------------
  - type: web
    name: ai-service
    env: python
    plan: free
    rootDir: services/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      # Must equal auth-service's JWT_SECRET: /ai/chat only serves callers with a valid access token
      - key: JWT_SECRET
        fromService:
          type: web
          name: auth-service
          envVarKey: JWT_SECRET
      - key: CORS_ORIGIN
        sync: false

# --------------------------------------------------------------------------------
# DATABASE
# Managed PostgreSQL database.
# --------------------------------------------------------------------------------
databases:
  - name: collab-db
    plan: free
    databaseName: collab_db
    user: collab_user
