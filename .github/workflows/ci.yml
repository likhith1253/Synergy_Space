name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Install and build all packages
    runs-on: ubuntu-latest
    env:
      # next.config.ts fails a production build if any of these is missing
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_DOCUMENT_URL: http://localhost:3002
      NEXT_PUBLIC_COLLAB_URL: http://localhost:3003
      NEXT_PUBLIC_AI_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  ai-service:
    name: AI service imports cleanly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src
